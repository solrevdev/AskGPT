name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  VERSION: 1.2.${{ github.run_number }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '10.0.x']
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release -p:Version=${{ env.VERSION }}
    - name: Pack
      run: dotnet pack --no-build -c Release -p:Version=${{ env.VERSION }}
    - name: Upload package
      if: matrix.dotnet-version == '10.0.x'
      uses: actions/upload-artifact@v2
      with:
        name: AskGPT-${{ env.VERSION }}-Package
        path: AskGPT/PackageOutput

